name: "Build: AArch64"

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# The config axis is the four configurations the README footprint tables
# describe, defined once in utils/ci/build-config.sh and shared with
# tools/footprint.sh. A reduced configuration cannot build the hand-written unit
# tests — they exercise APIs it removes — so it builds and runs the flag-tolerant
# vector runner instead, which skips the vectors whose capabilities are compiled
# out. fail-fast is off so one red configuration does not hide the others.
jobs:
  build-and-test:
    name: ${{ matrix.config }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        config: [ full, full-strict, minimal, minimal-noobj ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu cmake make \
            qemu-user qemu-user-static

      - name: Configure and build (${{ matrix.config }})
        run: |
          . utils/ci/build-config.sh
          mapfile -t CFG < <(sofab_config_args "${{ matrix.config }}")
          cmake -S . -B build \
            -DCMAKE_SYSTEM_PROCESSOR=aarch64 \
            -DCMAKE_SYSTEM_NAME=Linux \
            -DCMAKE_C_COMPILER=aarch64-linux-gnu-gcc \
            -DCMAKE_CXX_COMPILER=aarch64-linux-gnu-g++ \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_EXE_LINKER_FLAGS="-static" \
            -DSOFAB_ENABLE_CPP="$(sofab_config_cpp "${{ matrix.config }}")" \
            "${CFG[@]}"
          cmake --build build \
            --target "$(sofab_config_target "${{ matrix.config }}" hosted)" \
            --parallel "$(nproc)"

      - name: Library size (${{ matrix.config }})
        run: size build/src/libsofabuffers.a

      - name: Verify C binary
        if: startsWith(matrix.config, 'full')
        working-directory: build/test/c
        run: |
          file sofabtest
          readelf -h -A sofabtest

      - name: Verify C++ binary
        if: startsWith(matrix.config, 'full')
        working-directory: build/test/cpp
        run: |
          file sofabpptest
          readelf -h -A sofabpptest

      - name: Run tests (${{ matrix.config }})
        working-directory: build
        run: |
          if [[ "${{ matrix.config }}" == full* ]]; then
            ctest --output-on-failure --verbose
          else
            ctest -R test_vectors_c --output-on-failure --verbose
          fi
