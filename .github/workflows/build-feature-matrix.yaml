name: "Matrix: C features"

# Builds the standalone conformance-vector runner under each feature
# configuration and runs it. The runner skips vectors that need a capability the
# build was compiled without (each vector declares its "requires" tags), so the
# union of these configs exercises the encoder/decoder across every SOFAB_DISABLE_*
# combination. Each configuration is run on a little-endian (x86_64) and a
# big-endian (PowerPC, under qemu) target, so byte-order handling is covered for
# every feature set — including the 32-bit (no-int64) mode the native cross-arch
# jobs don't reach. The hand-written unit tests run separately, only in the full
# (max) build — see build-gcc-x86_64 / build-clang-x86_64.
#
# The matrix axis is the target arch (which decides the toolchain); the toolchain
# is installed once and the arch-specific CMake flags are captured in $CM_ARGS /
# $RUN, so each feature configuration is a separate, cheap step.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  vectors:
    runs-on: ubuntu-latest
    name: ${{ matrix.arch }}

    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, powerpc-be]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install dependencies (x86_64)
        if: matrix.arch == 'x86_64'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential cmake

      - name: Install dependencies (PowerPC big-endian + qemu)
        if: matrix.arch == 'powerpc-be'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-powerpc-linux-gnu cmake make qemu-user-static

      - name: Arch CMake flags
        run: |
          if [ "${{ matrix.arch }}" = powerpc-be ]; then
            echo "CM_ARGS=-DCMAKE_SYSTEM_NAME=Linux -DCMAKE_SYSTEM_PROCESSOR=powerpc \
              -DCMAKE_C_COMPILER=powerpc-linux-gnu-gcc -DCMAKE_BUILD_TYPE=Release \
              -DSOFAB_ENABLE_CPP=OFF -DSOFAB_ENABLE_BENCH=OFF -DCMAKE_EXE_LINKER_FLAGS=-static" >> "$GITHUB_ENV"
            echo "RUN=qemu-ppc-static" >> "$GITHUB_ENV"
          else
            echo "CM_ARGS=-DCMAKE_BUILD_TYPE=Debug -DSOFAB_ENABLE_CPP=OFF -DSOFAB_ENABLE_BENCH=OFF" >> "$GITHUB_ENV"
            echo "RUN=" >> "$GITHUB_ENV"
          fi

      # Build only the flag-tolerant vector runner: the hand-written unit tests
      # are intentionally max-only and would not compile in reduced configs.
      - name: max
        run: |
          cmake -S . -B build/max $CM_ARGS -DCMAKE_C_FLAGS=""
          cmake --build build/max --target sofab_vectortest --parallel $(nproc)
          $RUN ./build/max/test/c/sofab_vectortest

      - name: no-fp64
        run: |
          cmake -S . -B build/no-fp64 $CM_ARGS -DCMAKE_C_FLAGS="-DSOFAB_DISABLE_FP64_SUPPORT"
          cmake --build build/no-fp64 --target sofab_vectortest --parallel $(nproc)
          $RUN ./build/no-fp64/test/c/sofab_vectortest

      - name: no-int64
        run: |
          cmake -S . -B build/no-int64 $CM_ARGS -DCMAKE_C_FLAGS="-DSOFAB_DISABLE_INT64_SUPPORT"
          cmake --build build/no-int64 --target sofab_vectortest --parallel $(nproc)
          $RUN ./build/no-int64/test/c/sofab_vectortest

      - name: no-array
        run: |
          cmake -S . -B build/no-array $CM_ARGS -DCMAKE_C_FLAGS="-DSOFAB_DISABLE_ARRAY_SUPPORT"
          cmake --build build/no-array --target sofab_vectortest --parallel $(nproc)
          $RUN ./build/no-array/test/c/sofab_vectortest

      - name: no-sequence
        run: |
          cmake -S . -B build/no-sequence $CM_ARGS -DCMAKE_C_FLAGS="-DSOFAB_DISABLE_SEQUENCE_SUPPORT"
          cmake --build build/no-sequence --target sofab_vectortest --parallel $(nproc)
          $RUN ./build/no-sequence/test/c/sofab_vectortest

      - name: no-fixlen
        run: |
          cmake -S . -B build/no-fixlen $CM_ARGS -DCMAKE_C_FLAGS="-DSOFAB_DISABLE_FIXLEN_SUPPORT"
          cmake --build build/no-fixlen --target sofab_vectortest --parallel $(nproc)
          $RUN ./build/no-fixlen/test/c/sofab_vectortest

      # The hold-back openers compiled out, and with them the pending run in
      # sofab_ostream_t. A pure-C consumer encodes through sofab_object_encode(),
      # which decides omission per field before opening anything, so it never needs
      # them — this leg proves the core still builds and round-trips without them.
      #
      # Unlike every other configuration here, this one takes away no wire
      # capability: it is a full-featured build that a real pure-C consumer ships,
      # so the hand-written unit suite must compile and pass in it as well, not
      # only the flag-tolerant vector runner. The tests that call the hold-back
      # openers are #if-guarded in test_ostream.c for exactly this build.
      - name: no-lazy-seq
        run: |
          cmake -S . -B build/no-lazy-seq $CM_ARGS -DCMAKE_C_FLAGS="-DSOFAB_DISABLE_LAZY_SEQ_SUPPORT"
          cmake --build build/no-lazy-seq --target sofab_vectortest sofabtest --parallel $(nproc)
          $RUN ./build/no-lazy-seq/test/c/sofab_vectortest
          $RUN ./build/no-lazy-seq/test/c/sofabtest

      # The hold-back window is a documented, tunable bound (SOFAB_LAZY_SEQ_DEPTH,
      # CORELIB_PLAN §6), so a build that moves it must still pass the suite: the
      # bound costs canonicity past its depth, never validity.
      - name: lazy-seq-depth-2
        run: |
          cmake -S . -B build/lazy-seq-depth-2 $CM_ARGS -DCMAKE_C_FLAGS="-DSOFAB_LAZY_SEQ_DEPTH=2"
          cmake --build build/lazy-seq-depth-2 --target sofab_vectortest --parallel $(nproc)
          $RUN ./build/lazy-seq-depth-2/test/c/sofab_vectortest

      # ...but the tunable has a ceiling: the pending-run counter is a uint8_t, so
      # a window of 256 would wrap it and silently lose a whole run. Such a build
      # must be rejected at compile time, not miscompiled into wrong bytes.
      - name: lazy-seq-depth-256 (expect #error)
        run: |
          cmake -S . -B build/lazy-seq-depth-256 $CM_ARGS -DCMAKE_C_FLAGS="-DSOFAB_LAZY_SEQ_DEPTH=256"
          if out=$(cmake --build build/lazy-seq-depth-256 --target sofab_vectortest 2>&1); then
            echo "$out"; echo "::error::Expected the over-wide hold-back window to be rejected."; exit 1
          fi
          echo "$out"
          echo "$out" | grep -qF "SOFAB_LAZY_SEQ_DEPTH must be 1..255" \
            || { echo "::error::Build failed, but not with the expected #error."; exit 1; }
          echo "OK: build rejected with the expected #error."

      - name: no-overflow-check
        run: |
          cmake -S . -B build/no-overflow-check $CM_ARGS -DCMAKE_C_FLAGS="-DSOFAB_DISABLE_INTEGER_OVERFLOW_CHECK"
          cmake --build build/no-overflow-check --target sofab_vectortest --parallel $(nproc)
          $RUN ./build/no-overflow-check/test/c/sofab_vectortest

      - name: minimal
        run: |
          cmake -S . -B build/minimal $CM_ARGS \
            -DCMAKE_C_FLAGS="-DSOFAB_DISABLE_FIXLEN_SUPPORT -DSOFAB_DISABLE_ARRAY_SUPPORT -DSOFAB_DISABLE_SEQUENCE_SUPPORT -DSOFAB_DISABLE_INTEGER_OVERFLOW_CHECK"
          cmake --build build/minimal --target sofab_vectortest --parallel $(nproc)
          $RUN ./build/minimal/test/c/sofab_vectortest

      # Strict UTF-8 defaults OFF in this footprint corelib (CORELIB_PLAN §6.4),
      # so the negative `invalid_utf8` vectors are skipped in every leg above.
      # This leg turns the check ON explicitly (opt-in SOFAB_ENABLE_STRICT_UTF8)
      # so those negative vectors actually RUN and are asserted rejected — the
      # spec-mandated strict-ON configuration for a non-strict default build.
      - name: strict-utf8-on
        run: |
          cmake -S . -B build/strict-utf8-on $CM_ARGS -DCMAKE_C_FLAGS="-DSOFAB_ENABLE_STRICT_UTF8"
          cmake --build build/strict-utf8-on --target sofab_vectortest --parallel $(nproc)
          $RUN ./build/strict-utf8-on/test/c/sofab_vectortest
