name: Docs

on:
  push:
    branches: [ main ]

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent Pages deployment; don't cancel in-progress runs so a
# deploy that is already publishing is allowed to finish.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Every job below carries a timeout-minutes. A hung step must fail fast and
  # name itself: the account's Actions concurrency is 20, and one wedged job is a
  # slot everyone else waits on -- for six hours, at GitHub's 360-minute default.
  # The values are roughly 4x the job's observed runtime, so a slow runner still
  # passes and only a genuine wedge is cut off.
  build-documentation:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Doxygen
        run: |
          for i in 1 2 3; do
            sudo apt-get update \
              && sudo apt-get install -y \
                   cmake doxygen graphviz \
              && exit 0
            echo "::warning::apt attempt $i failed, retrying in 15s"
            sleep 15
          done
          echo "::error::apt-get failed after 3 attempts"
          exit 1

      - name: Configure with CMake
        run: |
          cmake -S . -B build \
            -DCMAKE_C_COMPILER_WORKS=ON \
            -DSOFAB_ENABLE_DOXYGEN=ON

      - name: Build documentation
        run: cmake --build build --target doc

      - name: Upload documentation
        uses: actions/upload-pages-artifact@v5
        with:
          path: build/docs/html

  # The docs are built and published on pushes to main only — the rest of the
  # family does the same. The guard below stays so a manual/other-event run
  # cannot overwrite the live site.
  deploy:
    needs: build-documentation
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
