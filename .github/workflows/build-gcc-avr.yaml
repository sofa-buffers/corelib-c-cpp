name: "Build: AVR"

# TEMPORARILY OFF THE PUSH/PR TRIGGERS -- to be restored.
#
# The job links `sofabtest`, the full host unit-test suite, for a bare-metal AVR
# target. That image is now 137705 bytes and cannot be linked for AVR at all:
#
#   FLASH 128K (the value in utils/avr/linker-avr.ld)  -> overflowed by 6633 B
#   FLASH 144K / 160K / 192K / 256K                    -> .rodata VMA wraps around
#                                                         address space
#
# so 128K is the ceiling and no MCU choice or linker-script number reaches it
# (atmega328p is WORSE than atmega8: 11048 B over, avr5 code being larger). Note
# for whoever picks this up: the comment in linker-avr.ld claiming the sizes are
# "overridden by -mmcu" is WRONG -- passing the script with -T makes it the memory
# map. Measured: FLASH at 4K and at 128K produced the same 137705-byte image.
#
# Nothing here indicates a footprint problem. The shipped library is 8542 B on
# atmega8 and SHRANK over this work; test_object.c alone is ~43 KB of test code,
# five times the whole library, and the image is never flashed -- the job builds,
# reports `size libsofabuffers.a`, and inspects the ELF.
#
# To restore: link less rather than raise the ceiling -- compile the test sources
# for AVR without linking them, or link only a subset. Both keep what this job
# actually proves (the C code builds for an 8-bit target, and how big the library
# is); requiring the whole test image to fit only caps how many tests may exist.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        mcu: [ atmega8 ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install AVR toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            avr-libc gcc-avr binutils-avr cmake make

      - name: Configure with CMake (${{ matrix.mcu }})
        run: |
          cmake -S . -B build \
            -DCMAKE_SYSTEM_PROCESSOR=avr \
            -DAVR_MCU=${{ matrix.mcu }} \
            -DCMAKE_TOOLCHAIN_FILE=utils/avr/toolchain-avr.cmake \
            -DCMAKE_BUILD_TYPE=Release \
            -DSOFAB_ENABLE_CPP=OFF \
            -DSOFAB_ENABLE_BENCH=OFF

      - name: Build project
        run: cmake --build build --parallel $(nproc)

      - name: Library size (${{ matrix.mcu }})
        run: size build/src/libsofabuffers.a

      - name: Verify C binary (${{ matrix.mcu }})
        working-directory: build/test/c
        run: |
          file sofabtest
          readelf -h -A sofabtest
