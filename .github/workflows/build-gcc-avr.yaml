name: "Build: AVR"

# TEMPORARILY OFF THE PUSH/PR TRIGGERS -- to be restored.
#
# The job links `sofabtest`, the full host unit-test suite, for a bare-metal AVR
# target. That image is now 137705 bytes and cannot be linked for AVR at all:
#
#   FLASH 128K (the value in utils/avr/linker-avr.ld)  -> overflowed by 6633 B
#   FLASH 144K / 160K / 192K / 256K                    -> .rodata VMA wraps around
#                                                         address space
#
# so 128K is the ceiling and no MCU choice or linker-script number reaches it
# (atmega328p is WORSE than atmega8: 11048 B over, avr5 code being larger). Note
# for whoever picks this up: the comment in linker-avr.ld claiming the sizes are
# "overridden by -mmcu" is WRONG -- passing the script with -T makes it the memory
# map. Measured: FLASH at 4K and at 128K produced the same 137705-byte image.
#
# Nothing here indicates a footprint problem. The shipped library is 8542 B on
# atmega8 and SHRANK over this work; test_object.c alone is ~43 KB of test code,
# five times the whole library, and the image is never flashed -- the job builds,
# reports `size libsofabuffers.a`, and inspects the ELF.
#
# To restore: link less rather than raise the ceiling -- compile the test sources
# for AVR without linking them, or link only a subset. Both keep what this job
# actually proves (the C code builds for an 8-bit target, and how big the library
# is); requiring the whole test image to fit only caps how many tests may exist.
on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Note for whoever restores the triggers above: only the two `full` cells of the
# config axis below link `sofabtest` at all. The two reduced ones build the
# library alone, so they are unaffected by the image-size problem and would run
# today — restoring the job for those two is a smaller step than fixing the link.
#
# The mcu axis stays a single entry, but not for the same reason the variants are
# pruned elsewhere: avr6 (atmega2560) differs from avr4 (atmega8) by ~95 bytes of
# .text, so it is a genuine variant, not a redundant one the way cortex-m0plus is.
# It is absent because utils/avr/linker-avr.ld declares a generic OUTPUT_ARCH(avr)
# and ld then rejects the avr6 runtime libraries ("skipping incompatible ...
# libc.a") when a test binary is linked — the same linker script the note above
# already flags as wrong about -mmcu. Both are one fix.
#
# The config axis is the four configurations the README footprint tables
# describe, defined once in utils/ci/build-config.sh and shared with
# tools/footprint.sh so the tables and this build cannot drift apart.
jobs:
  # Every job below carries a timeout-minutes. A hung step must fail fast and
  # name itself: the account's Actions concurrency is 20, and one wedged job is a
  # slot everyone else waits on -- for six hours, at GitHub's 360-minute default.
  # The values are roughly 4x the job's observed runtime, so a slow runner still
  # passes and only a genuine wedge is cut off.
  build:
    name: ${{ matrix.mcu }} / ${{ matrix.config }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        mcu: [ atmega8 ]
        config: [ full, full-strict, minimal, minimal-noobj ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install AVR toolchain
        run: |
          for i in 1 2 3; do
            sudo apt-get update \
              && sudo apt-get install -y --no-install-recommends \
                   avr-libc gcc-avr binutils-avr cmake make \
              && exit 0
            echo "::warning::apt attempt $i failed, retrying in 15s"
            sleep 15
          done
          echo "::error::apt-get failed after 3 attempts"
          exit 1

      # sofab_config_target picks what is buildable: the whole project for
      # `full`, the library alone for the rest (see build-config.sh — a reduced
      # configuration cannot build the max-only unit tests, and the test image is
      # not worth linking four times for a target that never runs it).
      - name: Configure and build (${{ matrix.mcu }}, ${{ matrix.config }})
        run: |
          . utils/ci/build-config.sh
          mapfile -t CFG < <(sofab_config_args "${{ matrix.config }}")
          cmake -S . -B build \
            -DCMAKE_SYSTEM_PROCESSOR=avr \
            -DAVR_MCU=${{ matrix.mcu }} \
            -DCMAKE_TOOLCHAIN_FILE=utils/avr/toolchain-avr.cmake \
            -DCMAKE_BUILD_TYPE=Release \
            -DSOFAB_ENABLE_CPP=OFF \
            -DSOFAB_ENABLE_BENCH=OFF \
            "${CFG[@]}"
          cmake --build build \
            --target "$(sofab_config_target "${{ matrix.config }}" baremetal)" \
            --parallel "$(nproc)"

      - name: Library size (${{ matrix.mcu }}, ${{ matrix.config }})
        run: size build/src/libsofabuffers.a

      - name: Verify C binary (${{ matrix.mcu }})
        if: matrix.config == 'full'
        working-directory: build/test/c
        run: |
          file sofabtest
          readelf -h -A sofabtest
