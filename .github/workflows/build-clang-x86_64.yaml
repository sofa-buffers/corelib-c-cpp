name: "Build: x86_64 (Clang)"

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# The config axis is the four configurations the README footprint tables
# describe, defined once in utils/ci/build-config.sh and shared with
# tools/footprint.sh. A reduced configuration cannot build the hand-written unit
# tests — they exercise APIs it removes — so it builds and runs the flag-tolerant
# vector runner instead, which skips the vectors whose capabilities are compiled
# out. fail-fast is off so one red configuration does not hide the others.
#
# The `full-strict` cell is what CORELIB_PLAN §6.4 requires: strict UTF-8 defaults
# OFF here, so only that cell compiles the validator in and runs the utf8 unit
# tests and the invalid_utf8 negative vectors. It replaces the separate
# strict-UTF-8 leg this workflow used to carry.
jobs:
  # Every job below carries a timeout-minutes. A hung step must fail fast and
  # name itself: the account's Actions concurrency is 20, and one wedged job is a
  # slot everyone else waits on -- for six hours, at GitHub's 360-minute default.
  # The values are roughly 4x the job's observed runtime, so a slow runner still
  # passes and only a genuine wedge is cut off.
  build-and-test:
    name: x86_64 (Clang)
    runs-on: ubuntu-latest
    timeout-minutes: 20


    # Everything that differs per target lives here; the four build steps
    # below are identical in every workflow and delegate to build-one.sh.
    env:
      SOFAB_TARGET_KIND: hosted
      SOFAB_RUN_TESTS: 1
      SOFAB_VERIFY_CXX: 1
      SOFAB_CPP_FROM_CONFIG: 1
      SOFAB_CMAKE_ARGS: |
        -DCMAKE_C_COMPILER=clang
        -DCMAKE_CXX_COMPILER=clang++
        -DCMAKE_BUILD_TYPE=Debug
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # clang++ is used with the default libstdc++ and the default linker: the
      # cmake call below passes no -stdlib=libc++ and no -fuse-ld=lld, and no
      # step invokes an llvm-* tool, so lld, libc++ and the llvm meta-package
      # were installed and never used.
      - name: Install build dependencies
        run: |
          for i in 1 2 3; do
            sudo apt-get update \
              && sudo apt-get install -y --no-install-recommends \
                   clang cmake make \
              && exit 0
            echo "::warning::apt attempt $i failed, retrying in 15s"
            sleep 15
          done
          echo "::error::apt-get failed after 3 attempts"
          exit 1

      # The four configurations are steps, not a matrix axis: they share one
      # toolchain install, and `if: always()` keeps a failing one from hiding
      # the other three. Each still reports its own name, duration and log.
      - name: full
        if: always()
        run: utils/ci/build-one.sh full

      - name: full-strict
        if: always()
        run: utils/ci/build-one.sh full-strict

      - name: minimal
        if: always()
        run: utils/ci/build-one.sh minimal

      - name: minimal-noobj
        if: always()
        run: utils/ci/build-one.sh minimal-noobj
