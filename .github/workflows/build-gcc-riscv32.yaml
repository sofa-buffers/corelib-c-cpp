name: "Build: RISC-V 32 (bare metal)"

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Bare-metal RV32, the RV32IMC row of the README footprint tables. This is a
# different target from "Build: RISC-V 64", which builds riscv64-linux-gnu and
# runs the test suite under QEMU — until this workflow existed, no CI job built
# the RV32IMC configuration the tables report.
#
# VARIANTS — one per ISA profile that actually changes the generated code,
# verified by compiling the corelib for each and comparing the objects:
#   rv32imc   the README row and the usual embedded profile
#   rv32i     no multiply, no compressed instructions — ~50% more .text, the
#             widest codegen difference in the family
#   rv32ec    RV32E: 16 registers and the ilp32e ABI, i.e. a different register
#             file rather than a different instruction set
# rv32imac is byte-for-byte the same size as rv32imc (the corelib uses no atomics)
# and rv32im sits between rv32i and rv32imc, so neither is carried.
#
# Nothing is linked for the target: there is no RV32 startup or linker script in
# utils/, and the vector runner needs a filesystem, so tests are off and only the
# library is built — exactly what tools/footprint.sh does for this row.
#
# CONFIGURATIONS come from utils/ci/build-config.sh, shared with
# tools/footprint.sh so the tables and this build cannot drift apart.
jobs:
  # Every job below carries a timeout-minutes. A hung step must fail fast and
  # name itself: the account's Actions concurrency is 20, and one wedged job is a
  # slot everyone else waits on -- for six hours, at GitHub's 360-minute default.
  # The values are roughly 4x the job's observed runtime, so a slow runner still
  # passes and only a genuine wedge is cut off.
  build:
    name: ${{ matrix.variant.march }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        variant:
          - { march: rv32imc, mabi: ilp32 }
          - { march: rv32i,   mabi: ilp32 }
          - { march: rv32ec,  mabi: ilp32e }

    # Everything that differs per target lives here; the four build steps
    # below are identical in every workflow and delegate to build-one.sh.
    env:
      SOFAB_TARGET_KIND: baremetal
      SOFAB_VERIFY_C: 0
      SOFAB_BUILD_TARGET: sofabuffers
      SOFAB_CMAKE_ARGS: |
        -DCMAKE_TOOLCHAIN_FILE=utils/riscv32/toolchain-riscv32.cmake
        -DRISCV_MARCH=${{ matrix.variant.march }}
        -DRISCV_MABI=${{ matrix.variant.mabi }}
        -DCMAKE_BUILD_TYPE=Release
        -DSOFAB_ENABLE_CPP=OFF
        -DSOFAB_ENABLE_BENCH=OFF
        -DSOFAB_BUILD_TESTS=OFF
        -DSOFAB_INSTALL=OFF
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # gcc-riscv64-unknown-elf ships no C library; picolibc supplies the headers
      # via the --specs=picolibc.specs the toolchain file passes.
      - name: Install RISC-V bare-metal toolchain
        run: |
          for i in 1 2 3; do
            sudo apt-get update \
              && sudo apt-get install -y --no-install-recommends \
                   gcc-riscv64-unknown-elf picolibc-riscv64-unknown-elf cmake make \
              && exit 0
            echo "::warning::apt attempt $i failed, retrying in 15s"
            sleep 15
          done
          echo "::error::apt-get failed after 3 attempts"
          exit 1

      # The four configurations are steps, not a matrix axis: they share one
      # toolchain install, and `if: always()` keeps a failing one from hiding
      # the other three. Each still reports its own name, duration and log.
      - name: full
        if: always()
        run: utils/ci/build-one.sh full

      - name: full-strict
        if: always()
        run: utils/ci/build-one.sh full-strict

      - name: minimal
        if: always()
        run: utils/ci/build-one.sh minimal

      - name: minimal-noobj
        if: always()
        run: utils/ci/build-one.sh minimal-noobj
