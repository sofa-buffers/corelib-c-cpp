name: "Build: RL78"

on:
  push:
    branches: [ main, workflow/rl78 ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# One variant: the Renesas RL78 LLVM toolchain has a single relevant target here.
# The config axis is the four configurations the README footprint tables
# describe, defined once in utils/ci/build-config.sh and shared with
# tools/footprint.sh. A reduced configuration cannot build the hand-written unit
# tests — they exercise APIs it removes — so it builds the library alone;
# RL78 is bare metal, so the flag-tolerant vector runner (which needs a
# filesystem) is unavailable either way. fail-fast is off so one red
# configuration does not hide the others.
jobs:
  build:
    name: rl78 / ${{ matrix.config }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        config: [ full, full-strict, minimal, minimal-noobj ]

    env:
      LLVM_VERSION: "17.0.1.202512"
      TOOLCHAIN_PATH: "/opt/llvm-rl78-elf"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            curl cmake make

      - name: Prepare Toolchain Directory
        run: |
          sudo mkdir -p ${{ env.TOOLCHAIN_PATH }}
          sudo chown $USER:$USER ${{ env.TOOLCHAIN_PATH }}

      - name: Cache RL78 toolchain
        id: cache-rl78
        uses: actions/cache@v6
        with:
          path: ${{ env.TOOLCHAIN_PATH }}
          key: rl78-toolchain-${{ env.LLVM_VERSION }}

      - name: Download RL78 toolchain
        if: steps.cache-rl78.outputs.cache-hit != 'true'
        run: |
          curl -L "https://llvm-gcc-renesas.com/downloads/download.php?s=cdn&f=rl78/${{ env.LLVM_VERSION }}/llvm-${{ env.LLVM_VERSION }}-rl78-elf.tar.gz" -o /tmp/rl78-llvm.tar.gz
          tar -xzf /tmp/rl78-llvm.tar.gz -C ${{ env.TOOLCHAIN_PATH }} --strip-components=2

      - name: Configure and build (${{ matrix.config }})
        run: |
          . utils/ci/build-config.sh
          mapfile -t CFG < <(sofab_config_args "${{ matrix.config }}")
          cmake -S . -B build \
            -DLLVM_PATH=${{ env.TOOLCHAIN_PATH }}/bin \
            -DCMAKE_TOOLCHAIN_FILE=utils/rl78/toolchain-rl78.cmake \
            -DCMAKE_BUILD_TYPE=Release \
            -DSOFAB_ENABLE_CPP=OFF \
            -DSOFAB_ENABLE_BENCH=OFF \
            "${CFG[@]}"
          cmake --build build \
            --target "$(sofab_config_target "${{ matrix.config }}" baremetal)" \
            --parallel "$(nproc)"

      - name: Library size (${{ matrix.config }})
        run: size build/src/libsofabuffers.a

      - name: Verify C binary
        if: matrix.config == 'full'
        working-directory: build/test/c
        run: |
          file sofabtest
          readelf -h -A sofabtest
