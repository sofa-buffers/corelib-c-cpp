name: "Build: Cortex-M"

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Two matrix axes: the ISA variant and the build configuration.
#
# VARIANTS — one representative per march that actually changes the generated
# code. Verified by compiling the corelib for each and comparing the objects:
# cortex-m0plus is byte-identical to cortex-m0 and cortex-m85 to cortex-m55, so
# those are intentionally omitted; the five below all differ. The dependency-free
# C corelib emits no FP/DSP/MVE instructions, so the +fp/+mve march suffixes do
# not pull in any of that — they are carried because the README footprint row is
# labelled for the fp.dp target.
#
# CONFIGURATIONS — the four the README footprint tables describe, defined once in
# utils/ci/build-config.sh and shared with tools/footprint.sh so a table
# regenerated by the script and a library built here cannot disagree.
#
# fail-fast is off so one red cell does not hide the state of the other 19.
jobs:
  build:
    name: ${{ matrix.variant.mtune }} / ${{ matrix.config }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        config: [ full, full-strict, minimal, minimal-noobj ]
        variant:
          - { mtune: cortex-m0,  march: armv6-m }
          - { mtune: cortex-m3,  march: armv7-m }
          - { mtune: cortex-m7,  march: armv7e-m+fp.dp }
          - { mtune: cortex-m23, march: armv8-m.base }
          - { mtune: cortex-m55, march: armv8.1-m.main+mve }

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install ARM Cortex-M toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc-arm-none-eabi gdb-arm-none-eabi cmake make

      # sofab_config_target picks what is buildable: the whole project for
      # `full`, the library alone for the rest (see build-config.sh — a reduced
      # configuration cannot build the max-only unit tests, and the test image is
      # not worth linking four times for a target that never runs it).
      - name: Configure and build (${{ matrix.variant.march }}, ${{ matrix.config }})
        run: |
          . utils/ci/build-config.sh
          mapfile -t CFG < <(sofab_config_args "${{ matrix.config }}")
          cmake -S . -B build \
            -DCMAKE_SYSTEM_PROCESSOR=arm \
            -DCMAKE_TOOLCHAIN_FILE=utils/cortex-m/toolchain-arm-none-eabi.cmake \
            -DCMAKE_BUILD_TYPE=Release \
            -DSOFAB_ENABLE_CPP=OFF \
            -DSOFAB_ENABLE_BENCH=OFF \
            -DARM_MARCH=${{ matrix.variant.march }} \
            -DARM_MTUNE=${{ matrix.variant.mtune }} \
            "${CFG[@]}"
          cmake --build build \
            --target "$(sofab_config_target "${{ matrix.config }}" baremetal)" \
            --parallel "$(nproc)"

      - name: Library size (${{ matrix.variant.mtune }}, ${{ matrix.config }})
        run: size build/src/libsofabuffers.a

      - name: Verify C binary
        if: matrix.config == 'full'
        working-directory: build/test/c
        run: |
          file sofabtest
          readelf -h -A sofabtest
