name: "Build: x86_64 (GCC)"

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake

      - name: Configure with CMake
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Debug

      - name: Build project
        run: cmake --build build --parallel $(nproc)

      - name: Library size
        run: size build/src/libsofabuffers.a

      - name: Verify C binary
        working-directory: build/test/c/
        run: |
          file sofabtest
          readelf -h -A sofabtest

      - name: Verify C++ binary
        working-directory: build/test/cpp/
        run: |
          file sofabpptest
          readelf -h -A sofabpptest

      - name: Run tests
        working-directory: build
        run: ctest --output-on-failure --verbose

      # This footprint corelib defaults its opt-in features OFF, so the build
      # above compiles them out and the tests covering them do not run. Each one
      # must still be built and tested, so this second leg turns them all on and
      # reruns the full ctest suite:
      #
      #   SOFAB_ENABLE_STRICT_UTF8   — CORELIB_PLAN §6.4 requires the strict-ON
      #                                configuration to be conformance-tested;
      #                                brings in the utf8 validator tests and the
      #                                invalid_utf8 negative vectors.
      #   SOFAB_ENABLE_SKIP_COUNTER  — brings in the assertions on
      #                                sofab_istream_skipped / IStreamImpl::skipped.
      #
      # The default leg above is what proves the library still builds, and the
      # §7.3 skips still happen, with every one of them compiled out.
      - name: Configure with CMake (opt-in features ON)
        run: |
          cmake -S . -B build-optin \
            -DCMAKE_BUILD_TYPE=Debug \
            -DSOFAB_ENABLE_STRICT_UTF8=ON \
            -DSOFAB_ENABLE_SKIP_COUNTER=ON

      - name: Build project (opt-in features ON)
        run: cmake --build build-optin --parallel $(nproc)

      - name: Run tests (opt-in features ON)
        working-directory: build-optin
        run: ctest --output-on-failure --verbose
